    <script>
        function showCalculator(calculatorId) {
            document.querySelectorAll('.calculator').forEach(calculator => {
                calculator.style.display = 'none';
            });
            document.getElementById(calculatorId).style.display = 'block';
        }

        function calculateAtalPension() {
            const age = parseFloat(document.getElementById('atalAge').value);
            const contribution = parseFloat(document.getElementById('atalContribution').value);

            if (isNaN(age) || isNaN(contribution) || age < 18 || age > 40) {
                alert('Please enter valid age (18-40) and contribution.');
                return;
            }

            const pensionAmount = contribution * 240;
            document.getElementById('atalResult').style.display = 'block';
            document.getElementById('atalResult').innerHTML = `<p><strong>Estimated Pension Amount:</strong> INR ${pensionAmount.toFixed(2)}</p>`;
        }

        function calculateBikeEmi() {
            const loanAmount = parseFloat(document.getElementById('bikeLoanAmount').value);
            const interestRate = parseFloat(document.getElementById('bikeInterestRate').value) / 12 / 100;
            const tenure = parseFloat(document.getElementById('bikeTenure').value);

            if (isNaN(loanAmount) || isNaN(interestRate) || isNaN(tenure)) {
                alert('Please enter valid inputs.');
                return;
            }

            const emi = (loanAmount * interestRate * Math.pow(1 + interestRate, tenure)) / (Math.pow(1 + interestRate, tenure) - 1);

            document.getElementById('bikeResult').style.display = 'block';
            document.getElementById('bikeResult').innerHTML = `<p><strong>Monthly EMI:</strong> INR ${emi.toFixed(2)}</p>`;
        }

        function calculateCarLoanEmi() {
            const loanAmount = parseFloat(document.getElementById('carLoanAmount').value);
            const interestRate = parseFloat(document.getElementById('carInterestRate').value) / 12 / 100;
            const tenure = parseFloat(document.getElementById('carTenure').value);

            if (isNaN(loanAmount) || isNaN(interestRate) || isNaN(tenure)) {
                alert('Please enter valid inputs.');
                return;
            }

            const emi = (loanAmount * interestRate * Math.pow(1 + interestRate, tenure)) / (Math.pow(1 + interestRate, tenure) - 1);

            document.getElementById('carResult').style.display = 'block';
            document.getElementById('carResult').innerHTML = `<p><strong>Monthly EMI:</strong> INR ${emi.toFixed(2)}</p>`;
        }

        function calculateHomeLoanEmi() {
            const loanAmount = parseFloat(document.getElementById('homeLoanAmount').value);
            const interestRate = parseFloat(document.getElementById('homeInterestRate').value) / 12 / 100;
            const tenure = parseFloat(document.getElementById('homeTenure').value);

            if (isNaN(loanAmount) || isNaN(interestRate) || isNaN(tenure)) {
                alert('Please enter valid inputs.');
                return;
            }

            const emi = (loanAmount * interestRate * Math.pow(1 + interestRate, tenure)) / (Math.pow(1 + interestRate, tenure) - 1);

            document.getElementById('homeResult').style.display = 'block';
            document.getElementById('homeResult').innerHTML = `<p><strong>Monthly EMI:</strong> INR ${emi.toFixed(2)}</p>`;
        }

        function calculateFd() {
            const fdAmount = parseFloat(document.getElementById('fdAmount').value);
            const fdRate = parseFloat(document.getElementById('fdRate').value) / 100;
            const fdTenure = parseFloat(document.getElementById('fdTenure').value) * 12;

            if (isNaN(fdAmount) || isNaN(fdRate) || isNaN(fdTenure)) {
                alert('Please enter valid inputs.');
                return;
            }

            const maturityAmount = fdAmount * Math.pow(1 + fdRate, fdTenure);

            document.getElementById('fdResult').style.display = 'block';
            document.getElementById('fdResult').innerHTML = `<p><strong>Maturity Amount:</strong> INR ${maturityAmount.toFixed(2)}</p>`;
        }

        function calculateEpf() {
            const monthlyContribution = parseFloat(document.getElementById('epfMonthlyContribution').value);
            const rate = parseFloat(document.getElementById('epfRate').value) / 100 / 12;
            const tenure = parseFloat(document.getElementById('epfTenure').value) * 12;

            if (isNaN(monthlyContribution) || isNaN(rate) || isNaN(tenure)) {
                alert('Please enter valid inputs.');
                return;
            }

            const futureValue = monthlyContribution * ((Math.pow(1 + rate, tenure) - 1) / rate);

            document.getElementById('epfResult').style.display = 'block';
            document.getElementById('epfResult').innerHTML = `<p><strong>EPF Balance:</strong> INR ${futureValue.toFixed(2)}</p>`;
        }

    <div class="calculator">
        <h2>Loss Ratio Calculator</h2>

        <div class="form-group">
            <label for="claimsIncurred">Claims Incurred (INR):</label>
            <input type="number" id="claimsIncurred" placeholder="Enter claims incurred">
        </div>

        <div class="form-group">
            <label for="premiumsEarned">Premiums Earned (INR):</label>
            <input type="number" id="premiumsEarned" placeholder="Enter premiums earned">
        </div>

        <button onclick="calculateLossRatio()">Calculate Loss Ratio</button>

    <script>
        function calculateLossRatio() {
            const claimsIncurred = parseFloat(document.getElementById('claimsIncurred').value);
            const premiumsEarned = parseFloat(document.getElementById('premiumsEarned').value);

            if (isNaN(claimsIncurred) || isNaN(premiumsEarned) || premiumsEarned === 0) {
                alert('Please enter valid values for claims and premiums, and ensure premiums are not zero.');
                return;
            }

        <div class="result" id="amount-with-gst">Amount With GST: ₹0.00</div>

        <label class="label">Select GST Type</label>

            <select class="select" id="gst-rate" onchange="autoCalculateGST()" style="flex: 1;">
                <option value="0">0%</option>

                <option value="12">12%</option>
                <option value="18">18%</option>
                <option value="28">28%</option>
            </select>
            <button class="clear-button" onclick="clearGST()">Clear</button>
        </div>

        <input class="input" type="text" id="transaction-amount" placeholder="Enter amount" oninput="autoCalculateGST()" />

        <!-- Dial Pad -->
        <div class="dial-pad">
            <button class="dial-button" onclick="appendNumber(1)">1</button>
            <button class="dial-button" onclick="appendNumber(2)">2</button>

            <button class="dial-button" onclick="appendNumber(9)">9</button>
            <button class="dial-button" onclick="appendDecimal()">.</button>

    <script>
        let currentAmount = "";

        function appendNumber(num) {
            currentAmount += num;
            document.getElementById('transaction-amount').value = currentAmount;
            autoCalculateGST();
        }

        function appendDecimal() {
            if (!currentAmount.includes('.')) {
                currentAmount += '.';
                document.getElementById('transaction-amount').value = currentAmount;
                autoCalculateGST();
            }
        }

        function deleteLastDigit() {
            currentAmount = currentAmount.slice(0, -1);
            document.getElementById('transaction-amount').value = currentAmount;
            autoCalculateGST();
        }

        function autoCalculateGST() {
            const amountWithGST = parseFloat(document.getElementById('transaction-amount').value) || 0;
            const gstRate = parseFloat(document.getElementById('gst-rate').value);
            const taxType = document.getElementById('tax-type').value;

            const amountWithoutGST = amountWithGST / (1 + gstRate / 100);
            const gstAmount = amountWithGST - amountWithoutGST;

            let cgstAmount = 0, sgstAmount = 0;
            if (taxType === 'CGST-SGST') {
                cgstAmount = gstAmount / 2;
                sgstAmount = gstAmount / 2;
            } else if (taxType === 'IGST') {
                cgstAmount = gstAmount;
                sgstAmount = 0;
            }

            updateDisplay(amountWithGST, amountWithoutGST, gstAmount, cgstAmount, sgstAmount);
        }

        function updateDisplay(amountWithGST, amountWithoutGST, gstAmount, cgstAmount, sgstAmount) {
            document.getElementById('gst-result').innerText = `GST Amount: ₹${gstAmount.toFixed(2)}`;
            document.getElementById('amount-without-gst').innerText = `Amount Without GST: ₹${amountWithoutGST.toFixed(2)}`;
            document.getElementById('amount-with-gst').innerText = `Amount With GST: ₹${amountWithGST.toFixed(2)}`;
            document.getElementById('gst-breakdown').innerText = `CGST: ₹${cgstAmount.toFixed(2)} | SGST: ₹${sgstAmount.toFixed(2)}`;
        }

        function clearGST() {
            document.getElementById('transaction-amount').value = ""; // Clear only the transaction amount
            currentAmount = ""; // Reset the currentAmount variable
            autoCalculateGST(); // Recalculate with the empty input, which will reset all calculations
        }

            const netSalary = grossSalary - taxAmount;

            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <p><strong>Tax Amount:</strong> INR ${taxAmount.toFixed(2)}</p>
                <p><strong>Net Salary:</strong> INR ${netSalary.toFixed(2)}</p>
            `;
        }
    </script>
</body>
</html>
